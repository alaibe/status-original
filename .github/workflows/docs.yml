name: Docs

on:
  push:
    branches: [main]
    paths:
      # PRIVACY.md is included into docs/privacy.md; the other root documents
      # are for the repository, not the site.
      - 'docs/**'
      - 'PRIVACY.md'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an older queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app's postinstall patches native packages this job does not need.
      - run: npm ci --ignore-scripts
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
