# Opens a dapp in the system browser and comes back with the composer free again.
appId: com.statusoriginal.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "conversation-local-status"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "statusoriginal://chat/local-dapps"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 15000

- tapOn:
    id: "composer-input"
- inputText: "/browse uniswap"
- tapOn:
    id: "composer-send"
- runFlow: lib/expect-safari-uniswap.yaml
- extendedWaitUntil:
    visible: "Opening Uniswap.*"
    timeout: 10000
- assertNotVisible: "Running /browse.*"

# The same through a widget row's action sheet, which has to finish closing
# before anything else can be presented.
- tapOn:
    id: "quick-dapps"
- extendedWaitUntil:
    visible: "Aave.*"
    timeout: 15000
- tapOn: "Aave.*"
- extendedWaitUntil:
    visible: "Open Aave"
    timeout: 5000
- tapOn: "Open Aave"
- runFlow: lib/expect-safari-aave.yaml
- assertNotVisible: "Running /browse.*"
- tapOn:
    id: "composer-input"
- inputText: "hello"
- assertVisible:
    id: "composer-send"
- tapOn: "Back"
