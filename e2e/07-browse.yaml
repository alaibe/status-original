# Opens a dapp in the in-app browser and comes back with the composer free again.
appId: com.statusoriginal.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "conversation-local-status"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "statusoriginal://chat/local-dapps"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 15000

- tapOn:
    id: "composer-input"
- inputText: "/browse uniswap"
- tapOn:
    id: "composer-send"
- extendedWaitUntil:
    visible: "Done"
    timeout: 20000
- assertVisible: "Address"
- tapOn: "Done"

- extendedWaitUntil:
    visible: "Opening Uniswap.*"
    timeout: 10000
- assertNotVisible: "Running /browse.*"

# The same through a widget row's action sheet, which has to finish closing
# before the browser can be presented.
- tapOn:
    id: "quick-dapps"
- extendedWaitUntil:
    visible: "Zapper.*"
    timeout: 15000
- tapOn: "Zapper.*"
- extendedWaitUntil:
    visible: "Open Zapper"
    timeout: 5000
- tapOn: "Open Zapper"
- extendedWaitUntil:
    visible: "Done"
    timeout: 20000
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "Running /browse.*"
    timeout: 10000
- tapOn:
    id: "composer-input"
- inputText: "hello"
- assertVisible:
    id: "composer-send"
- tapOn: "Back"
