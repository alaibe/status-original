# Sends TEXT from an emptied composer, since the chat may keep a draft, then taps the gutter beside the reply to dismiss the keyboard.
appId: com.statusoriginal.app
---
- tapOn:
    id: "composer-input"
- eraseText: 200
- inputText: ${TEXT}
- tapOn:
    id: "composer-send"
- tapOn:
    point: "95%,40%"
