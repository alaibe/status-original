# Enables a plugin, uses its room, and disables it again.
appId: com.statusoriginal.app
---
- runFlow: lib/open-status-room.yaml

- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/enable markets"

- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible:
      id: "conversation-local-markets"
    timeout: 15000

- tapOn:
    id: "conversation-local-markets"
- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/alerts"
- extendedWaitUntil:
    visible: "alert.*"
    timeout: 15000

- tapOn:
    id: "BackButton"
- openLink: "statusoriginal://chat/local-status"
- runFlow:
    file: lib/send-command.yaml
    env:
      TEXT: "/disable markets"
- tapOn:
    id: "BackButton"
- assertNotVisible:
    id: "conversation-local-markets"
