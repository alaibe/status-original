[package]
name = "status-original"
version = "1.0.0"
description = "A self-custodial messenger."
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "status_original_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
ledger-transport-hid = "0.11"
ledger-apdu = "0.11"

# SQLCipher from source. macOS gets CommonCrypto; everything else compiles its
# own OpenSSL so the build has no system dependency.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-contacts = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSEnumerator", "NSError", "NSObject", "NSString"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
